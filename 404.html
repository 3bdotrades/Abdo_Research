<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — الصفحة غير موجودة | أبحاث كمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;700&display=swap">
  <script src="i18n.js?v=owner-video-4" defer></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050608;
      --gold: #D4AF37;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --gold-glow: rgba(212, 175, 55, 0.08);
      --text: #e8e8e8;
      --text-muted: #8a8a9a;
      --border: rgba(255, 255, 255, 0.07);
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', 'Cairo', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Soft ambient glows matching main site */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -150px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.04) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 560px;
      width: 100%;
      padding: 56px 40px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .error-code {
      font-family: 'Cairo', sans-serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      letter-spacing: -4px;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.25);
      margin-bottom: 8px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 24px auto;
      border-radius: 2px;
      opacity: 0.6;
    }

    .subtitle {
      font-family: 'Cairo', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .body-text {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 40px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 32px;
      background: linear-gradient(135deg, #D4AF37 0%, #b8962e 100%);
      color: #050608;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 50px;
      transition: opacity 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 32px;
      background: transparent;
      color: var(--gold);
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 50px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--gold-dim);
      border-color: rgba(212, 175, 55, 0.7);
      transform: translateY(-1px);
    }

    .brand-tag {
      display: inline-block;
      margin-bottom: 28px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0.7;
    }

    .language-switcher {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 999px;
      background: rgba(7, 8, 10, 0.8);
    }

    html[dir="ltr"] .language-switcher {
      right: auto;
      left: 18px;
    }

    .lang-toggle-btn {
      min-width: 36px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Cairo', sans-serif;
      font-size: 0.72rem;
      font-weight: 900;
      cursor: pointer;
    }

    .lang-toggle-btn.is-active {
      background: var(--gold);
      color: #050608;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 24px;
      }
      .btn-group {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-primary,
      .btn-secondary {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="brand-tag">أبحاث كمية · الأسواق العربية</span>
    <div class="error-code">404</div>
    <div class="divider"></div>
    <h1 class="subtitle">الصفحة غير موجودة</h1>
    <p class="body-text">يبدو أن الصفحة التي تبحث عنها غير متاحة أو تم نقلها.</p>
    <div class="btn-group">
      <a href="/" class="btn-primary">العودة للرئيسية</a>
      <a href="/contact.html" class="btn-secondary">تواصل معي</a>
    </div>
  </div>
</body>
</html>

  <style>
    .post-shell {
      position: relative;
      z-index: 2;
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 128px 0 72px;
    }


    .post-article {
      padding: 42px;
    }

    .post-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 24px;
    }

    .post-title {
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1.18;
      margin-bottom: 22px;
      letter-spacing: 0;
    }

    .post-excerpt {
      color: var(--text-muted);
      font-size: 1.02rem;
      line-height: 1.9;
      margin-bottom: 34px;
    }

    .post-cover {
      width: 100%;
      aspect-ratio: 16 / 8;
      border-radius: 18px;
      overflow: hidden;
      margin: 0 0 32px;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 18px 44px rgba(0,0,0,0.28);
    }

    .post-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .post-body {
      border-top: 1px solid var(--border-color);
      padding-top: 30px;
    }

    .post-body p {
      color: var(--text-main);
      font-size: 1rem;
      line-height: 2.05;
      margin-bottom: 22px;
    }

    .post-state {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.9;
    }

    @media (max-width: 640px) {
      .post-shell {
        width: min(100% - 22px, 920px);
        padding-top: 104px;
      }

      .post-article {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-subtle-glow glow-primary"></div>
  <div class="bg-subtle-glow glow-green"></div>

  <header>

      <a href="index.html" class="inner-home-link" aria-label="العودة للرئيسية">الرئيسية</a>

  <main class="post-shell">

    <article class="post-article glass-panel" id="post-article">
      <p class="post-state">جاري تحميل المنشور...</p>
    </article>
  </main>

  <script src="auth.js" defer></script>
  <script src="post.js?v=csp-1" defer></script>
</body>
